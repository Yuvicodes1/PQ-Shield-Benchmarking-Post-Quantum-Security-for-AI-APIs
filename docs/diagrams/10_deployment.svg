<svg width="100%" viewBox="0 0 900 746" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="900" height="746" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9Z" fill="#64748b"/></marker></defs>
  <rect x="60" y="40" width="780" height="420" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="76" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">Docker build time</text>
  <rect x="100" y="90" width="700" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450.0" y="110.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">Build liboqs from source</text>
  <text x="450.0" y="131.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d28d9">OQS_MINIMAL_BUILD: ML-KEM-768, ML-DSA-65 only</text>
  <rect x="100" y="168" width="700" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450.0" y="188.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">pip install requirements.txt</text>
  <text x="450.0" y="209.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d28d9">pinned versions</text>
  <rect x="100" y="246" width="700" height="44" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450.0" y="273.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">python -m model.train</text>
  <rect x="100" y="310" width="700" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450.0" y="330.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">crypto self-test</text>
  <text x="450.0" y="351.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d28d9">python -m crypto.oqs_adapter</text>
  <rect x="100" y="388" width="700" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450.0" y="408.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">python -m pytest -q</text>
  <text x="450.0" y="429.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d28d9">13 protocol tests</text>
  <line x1="450" y1="148" x2="450" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="226" x2="450" y2="246" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="290" x2="450" y2="310" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="368" x2="450" y2="388" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="446" x2="450" y2="496" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="500" y="480" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">build fails if any step fails — a broken image never ships</text>
  <rect x="300" y="496" width="300" height="50" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450.0" y="526.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14532d">pq-shield image</text>
  <line x1="450.0" y1="546" x2="450.0" y2="586" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="220" y="586" width="460" height="50" rx="9" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="450.0" y="616.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#831843">docker run ... uvicorn / bench.orchestrator</text>
  <text x="450" y="676" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Locally, scripts/install_oqs.sh does the same minimal liboqs build into &lt;repo&gt;/oqs-prefix/,</text>
  <text x="450" y="694" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">and .env carries PQ_SHIELD_OQS_LIB so every entrypoint — CLI, pytest, Streamlit —</text>
  <text x="450" y="712" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">finds the same shared library without a system-wide install.</text>
</svg>
