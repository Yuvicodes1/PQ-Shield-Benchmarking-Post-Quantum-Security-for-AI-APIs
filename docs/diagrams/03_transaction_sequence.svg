<svg width="100%" viewBox="0 0 1000 1004" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1000" height="1004" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9Z" fill="#64748b"/></marker></defs>
  <rect x="45" y="50" width="170" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="75" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Client</text>
  <rect x="315" y="50" width="170" height="40" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="75" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">Server</text>
  <rect x="575" y="50" width="170" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="660" y="75" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">ServerCryptoConfig</text>
  <rect x="815" y="50" width="170" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="900" y="75" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">model_service</text>
  <line x1="130" y1="90" x2="130" y2="970" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="400" y1="90" x2="400" y2="970" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="660" y1="90" x2="660" y2="970" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="900" y1="90" x2="900" y2="970" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="400" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="265.0" y="122" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GET /secure/handshake</text>
  <rect x="250" y="160" width="560" height="34" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="530.0" y="180" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">new_handshake() — fresh ephemeral key pair, generated per transaction by default</text>
  <line x1="400" y1="220" x2="130" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="265.0" y="212" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kex_public_key, sig_public_key, handshake_id</text>
  <rect x="22" y="260" width="388" height="74" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="216.0" y="280" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">establish() locally: generate session key,</text>
  <text x="216.0" y="298" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">wrap it for the server (RSA-OAEP encrypt /</text>
  <text x="216.0" y="316" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">ML-KEM encapsulate)</text>
  <line x1="130" y1="360" x2="400" y2="360" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="265.0" y="352" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">POST /secure/predict</text>
  <text x="270" y="376" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">{handshake_id, kex_blob, nonce, ciphertext}</text>
  <line x1="400" y1="416" x2="660" y2="416" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="530.0" y="408" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">accept(handshake_id, kex_blob)</text>
  <line x1="660" y1="446" x2="400" y2="446" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="530.0" y="438" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">session_key</text>
  <rect x="190" y="480" width="420" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="400.0" y="500" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AES-256-GCM decrypt request</text>
  <text x="400.0" y="518" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AEAD failure here = tamper caught before inference runs</text>
  <line x1="400" y1="560" x2="900" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="650.0" y="552" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">predict(input)</text>
  <line x1="900" y1="590" x2="400" y2="590" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="650.0" y="582" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prediction, probabilities</text>
  <rect x="230" y="624" width="340" height="34" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
  <text x="400.0" y="644" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AES-256-GCM encrypt response → envelope</text>
  <line x1="400" y1="684" x2="660" y2="684" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="530.0" y="676" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sign(handshake_id, envelope)</text>
  <line x1="660" y1="714" x2="400" y2="714" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="530.0" y="706" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">signature</text>
  <line x1="400" y1="748" x2="660" y2="748" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="530.0" y="740" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">forget(handshake_id)</text>
  <line x1="400" y1="788" x2="130" y2="788" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="265.0" y="780" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">SecurePredictResponse</text>
  <text x="550" y="804" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">{nonce, ciphertext, signature, server_timing_ms}</text>
  <rect x="15" y="844" width="460" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="245.0" y="864" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AES-256-GCM decrypt response</text>
  <text x="245.0" y="882" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">AEAD failure here = tamper caught before signature check</text>
  <line x1="130" y1="924" x2="660" y2="924" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="395.0" y="916" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">verify(envelope, signature, sig_public_key)</text>
  <line x1="660" y1="954" x2="130" y2="954" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="395.0" y="946" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">valid_signature (bool)</text>
</svg>
