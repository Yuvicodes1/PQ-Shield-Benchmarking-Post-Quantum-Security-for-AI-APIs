<svg width="100%" viewBox="0 0 1000 509" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1000" height="509" fill="#ffffff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9Z" fill="#64748b"/></marker></defs>
  <text x="50" y="45" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14b8a6">Shared contract (crypto/base.py)</text>
  <rect x="50" y="58" width="430" height="96" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="265.0" y="97.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#134e4a">ServerCryptoConfig</text>
  <text x="265.0" y="118.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">new_handshake · accept · sign · forget</text>
  <rect x="520" y="58" width="430" height="96" rx="9" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="735.0" y="97.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#134e4a">ClientCryptoConfig</text>
  <text x="735.0" y="118.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">establish · verify</text>
  <text x="50" y="178" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b5cf6">Three implementations, identical shape, different primitive</text>
  <rect x="50" y="225" width="280" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="190.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">Classical  (Config A)</text>
  <text x="190.0" y="273.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">RSA-2048-OAEP + ECDSA P-256</text>
  <rect x="360" y="225" width="280" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">Hybrid  (Config B)</text>
  <text x="500.0" y="273.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">ML-KEM-768 + ECDSA P-256</text>
  <rect x="670" y="225" width="280" height="72" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="810.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4c1d95">Full PQC  (Config C)</text>
  <text x="810.0" y="273.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">ML-KEM-768 + ML-DSA-65</text>
  <line x1="190.0" y1="225" x2="190.0" y2="201" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="500.0" y1="225" x2="500.0" y2="201" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="810.0" y1="225" x2="810.0" y2="201" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="870" y="205" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">implements</text>
  <text x="50" y="345" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f97316">PQC primitives used by Hybrid and Full PQC (crypto/oqs_adapter.py)</text>
  <rect x="300" y="357" width="220" height="64" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="410.0" y="380.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7c2d12">MLKEM768</text>
  <text x="410.0" y="401.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#c2410c">keypair · encaps · decaps</text>
  <rect x="560" y="357" width="220" height="64" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="670.0" y="380.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7c2d12">MLDSA65</text>
  <text x="670.0" y="401.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#c2410c">keypair · sign · verify</text>
  <path d="M 500.0 297 L 410.0 357" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 754.0 297 L 465.0 357" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 838.0 297 L 637.0 357" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="500" y="457" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">AES-256-GCM + HKDF-SHA256 (crypto/aead.py) is shared by all three configurations —</text>
  <text x="500" y="475" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">the independent variable this project measures is key establishment and signatures only.</text>
